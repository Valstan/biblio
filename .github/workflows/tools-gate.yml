name: tools-gate

# Гейт приёмки панели «МиниГен» (D-237, G650).
# Панель дважды отдавала пустую страницу: отданный скрипт не парсился
# (escape внутри template literal рвал строковый литерал), а сервер был
# здоров — отсюда «страница грузится» != «скрипт работает».
# Проверка ловит это ДО выкатки: рендерит шаблон так же, как Node, и
# прогоняет node --check по вырезанному скрипту.
on:
  pull_request:
    paths:
      - 'tools/minimax-project-areas/**'
  push:
    branches: [master]
    paths:
      - 'tools/minimax-project-areas/**'

jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Зависимости Python
        run: pip install pyyaml
      - name: Приёмка панели «МиниГен» (архив)
        run: python3 tools/minimax-project-areas/archive/check_panel.py --source-only
      - name: Приёмка переключения серверов Happ
        run: python3 tools/minimax-project-areas/test_minimax_netwatch_switch.py
      - name: Приёмка записи конфига областей
        run: python3 tools/minimax-project-areas/test_config_write_race.py
      - name: Приёмка перезапуска контура
        run: python3 tools/minimax-project-areas/test_minigen_contour_restart.py
      - name: Приёмка «без мигающих окон»
        run: python3 tools/minimax-project-areas/test_no_console_windows.py
      - name: Приёмка списка раскатки (все файлы, что грузят демоны)
        run: python3 tools/minimax-project-areas/test_rollout_covers_runtime_files.py
      - name: Приёмка сброса сессии на месте
        run: python3 tools/minimax-project-areas/test_session_reset_in_place.py
      - name: Приёмка лечения сессий по решению «Управляющего» (промт #172)
        run: python3 tools/minimax-project-areas/test_thread_treatment.py
      - name: Приёмка пробелов #172 (предел простоя вынесен явно; секретов в паспорте нет)
        run: python3 tools/minimax-project-areas/test_thread_treatment_gaps.py
      - name: Приёмка надзирателя (раскатка не должна оставлять программу без него)
        run: python3 tools/minimax-project-areas/test_rollout_keeps_supervisor.py
      - name: Приёмка канала промтов раздела (D-190)
        run: python3 tools/minimax-project-areas/test_karman_prompts.py
      - name: Приёмка канала промтов раздела MiniGen (D-190, программа «МиниГен»)
        run: python3 tools/minimax-project-areas/test_minigen_karman_prompts.py
      - name: Приёмка API при раскатке (программа не остаётся без API)
        run: python3 tools/minimax-project-areas/test_rollout_keeps_api.py
      - name: Приёмка версии по бандлу (окно и «версия на месте» — одно и то же)
        run: python3 tools/minimax-project-areas/test_rollout_version_from_build.py
      - name: Приёмка московского времени (время везде по Москве, Россия)
        run: python3 tools/minimax-project-areas/test_time_is_moscow.py
      - name: Приёмка окна глазами (окно умеет снимать свои вкладки)
        run: python3 tools/minimax-project-areas/test_window_smoke_ui.py
      - name: Приёмка остановки непрозрачного (повышенные процессы не видны WMI)
        run: python3 tools/minimax-project-areas/test_rollout_stops_hidden.py
      - name: Приёмка отправки «Продолжай» (лечащий живёт без ядра)
        run: python3 tools/minimax-project-areas/test_autheal_continue_sends.py
      - name: Приёмка экосистемы агентов (заявка из зачитки и раздел КАРМАНА)
        run: python3 tools/minimax-project-areas/test_agents_ecosystem.py
